[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["findata==0.1.0", "PyYAML>=6,<7", "tiktoken==0.14.0", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_agent = ["prompts/*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# The installed shared wheel does not publish typing markers; check local code.
module = ["runtime_contracts.*", "infra.*", "findata.*", "observability_context"]
ignore_missing_imports = true
