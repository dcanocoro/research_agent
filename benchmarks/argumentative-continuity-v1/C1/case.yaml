id: C1
title: Recuperación y revisión de un expediente sintético
context: Prueba operacional de A1, sin evaluación de inversión ni fuentes externas.
  Usa solo entradas/. Cada sesión arranca un proceso nuevo. Conserva una evaluación
  con ID liquidez_prueba y sus fundamentos en SQLite; Markdown es presentación.
competencies:
- persistencia
- recuperacion
- revision
- historial
difficulty: Operacional; no compara calidad financiera.
rubric: rubric.md
sessions:
- id: sesion-01
  message: Lee entradas/base.md y registra una evaluación de liquidez con ID liquidez_prueba
    y fundamentos referenciados. Explica lo observado y sus límites.
  publish:
    entradas/base.md: inputs/base.md
- id: sesion-02
  message: Recupera directamente liquidez_prueba desde el expediente. ¿Cuál es su
    revisión vigente y qué fundamento conserva? No hay información nueva.
  publish: {}
- id: sesion-03
  message: Se publica entradas/correccion.md. Recupera la evaluación, incorpora lo
    que cambie y conserva la historia. Si hay conflicto de revisión, recupera la revisión
    vigente antes de reintentar.
  publish:
    entradas/correccion.md: inputs/correccion.md
- id: sesion-04
  message: Recupera con las herramientas del expediente la evaluación anterior a la
    corrección y la vigente. Explica qué cambió, por qué y qué se mantuvo; distingue
    las versiones registradas de una reconstrucción desde fuentes.
  publish: {}
