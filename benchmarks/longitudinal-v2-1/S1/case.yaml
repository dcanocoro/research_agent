id: S1
title: ASML — Construcción y profundización de una tesis
context: Universo simulado de ASML. Todos los documentos y precios son ficticios.
  Responde exclusivamente dentro de este universo con los archivos publicados en entradas/;
  no incorpores datos reales externos. Las fechas son del reloj simulado y se indican
  en cada documento. Cada sesión conserva archivos, pero no el historial conversacional.
  No se presupone ninguna conclusión ni formato de memoria.
competencies:
- investigacion
- juicio
- revision
- memoria
- incertidumbre
- eficiencia
difficulty: 'Alta: dependencias económicas, revisión localizada e historia recuperable
  entre procesos.'
rubric: rubric.md
sessions:
- id: sesion-01
  message: Investiga ASML y determina si representa una oportunidad atractiva de inversión.
  publish:
    entradas/base.md: inputs/base.md
- id: sesion-02
  message: ¿Qué necesitas investigar ahora para mejorar tu evaluación?
  publish: {}
- id: sesion-03
  message: Dispones únicamente de dos consultas documentales adicionales. El catálogo
    está en entradas/catalogo.md; leerlo no consume consulta. Elige y consulta como
    máximo dos documentos de ese catálogo. ¿Qué aportan a tu evaluación?
  publish:
    entradas/catalogo.md: inputs/catalogo.md
    entradas/doc-a.md: inputs/doc-a.md
    entradas/doc-b.md: inputs/doc-b.md
    entradas/doc-c.md: inputs/doc-c.md
    entradas/doc-d.md: inputs/doc-d.md
    entradas/doc-e.md: inputs/doc-e.md
    entradas/doc-f.md: inputs/doc-f.md
  document_budget:
    paths:
    - entradas/doc-a.md
    - entradas/doc-b.md
    - entradas/doc-c.md
    - entradas/doc-d.md
    - entradas/doc-e.md
    - entradas/doc-f.md
    limit: 2
- id: sesion-04
  message: Han llegado informe-demanda.md, nota-entregas.md y cartera.md en entradas/.
    Actualiza tu evaluación e indica qué fundamentos cambian y cuáles conservas.
  publish:
    entradas/informe-demanda.md: inputs/informe-demanda.md
    entradas/nota-entregas.md: inputs/nota-entregas.md
    entradas/cartera.md: inputs/cartera.md
- id: sesion-05
  message: El único cambio nuevo está en entradas/precio.md. ¿Cómo evaluarías ahora
    la oportunidad de inversión?
  publish:
    entradas/precio.md: inputs/precio.md
- id: sesion-06
  message: 'Reconstruye la evaluación inicial y la vigente: qué fundamentos cambiaron,
    con qué información y en qué momento. Distingue lo recordado de lo que debas reconstruir.
    ¿Qué investigarías ahora?'
  publish: {}
