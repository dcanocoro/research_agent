messages:
  '2023-01-01': Soy un inversor a largo plazo. Dispongo de 100.000 USD ficticios y
    acepto mantener efectivo. Investiga dentro del universo disponible y decide cómo
    empezar; conserva lo útil para futuras revisiones.
  '2023-04-01': Revisa cómo ha evolucionado tu evaluación desde el comienzo. Decide
    si conviene actuar o conservar la cartera.
  '2023-07-01': Me preocupa la concentración. Revisa los riesgos de las posiciones
    y las alternativas que consideres relevantes.
  '2023-10-01': Comprueba si las nuevas cifras alteran los fundamentos de tus decisiones.
    No es obligatorio cambiar de opinión ni operar.
  '2024-01-01': Llevamos aproximadamente un año. Recupera lo conservado y revisa qué
    se sostiene, qué ha cambiado y qué queda pendiente.
  '2024-04-01': Reconsidera las posiciones que hoy merezcan atención. Distingue cambios
    de negocio, precio y tus hipótesis.
  '2024-07-01': Revisa si mantener efectivo o reasignar capital tiene sentido con
    la información disponible.
  '2024-10-01': Nos acercamos al final del seguimiento. Revisa la cartera y deja claros
    fundamentos, incertidumbres y asuntos que convendría seguir.
